plugins {
    id 'com.android.application'
}

android {
    namespace 'com.latpost'
    compileSdk 35

    signingConfigs {
        release {
            def keystorePath = System.getenv('LATPOST_KEYSTORE')
            def keystorePassword = System.getenv('LATPOST_KEYSTORE_PASSWORD')
            def releaseKeyPassword = System.getenv('LATPOST_KEY_PASSWORD')
            if (keystorePath && keystorePassword && releaseKeyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias 'latpost-release'
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.latpost'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
